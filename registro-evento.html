  <style>
    :root {
      --azul: #000c47; --azul-container: #001b7a; --ambar-bg: #fed488;
      --fondo: #ffffff; --superficie: #ffffff; --superficie-tenue: #F5F5F7;
      --tinta: #1b1b21; --tinta-suave: #454652; --linea: #E4E4E7;
      --verde: #2e7d32; --verde-bg: #e3f5e6; --rojo: #d32f2f; --rojo-bg: #fce4e4;
      --radio: 12px; --sombra: 0 1px 3px rgba(27,27,33,0.07), 0 1px 2px rgba(27,27,33,0.06);
    }
    * { box-sizing: border-box; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24; font-size: 1.15em; vertical-align: -3px; line-height: 1; }
    body {
      font-family: 'Hanken Grotesk', -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo); color: var(--tinta);
      max-width: 480px; margin: 0 auto; padding: 0 12px 40px; min-height: 100vh;
    }
    .marca { display: flex; align-items: center; gap: 10px; padding: 18px 4px 14px; }
    .marca .icono { width: 44px; height: 44px; flex-shrink: 0; }
    .marca .icono img { width: 100%; height: 100%; object-fit: contain; }
    .marca .texto { text-align: left; line-height: 1.15; }
    .marca .texto strong { display: block; font-size: 1.05em; font-weight: 700; }
    .marca .texto span { font-size: 0.75em; color: var(--tinta-suave); }
    .card {
      background: var(--superficie); padding: 22px 20px; border-radius: var(--radio);
      border: 1px solid var(--linea); box-shadow: var(--sombra); position: relative; overflow: hidden;
    }
    .card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--azul), var(--ambar-bg));
    }
    h2 { font-size: 1.3em; font-weight: 700; margin: 4px 0 10px; color: var(--azul); }
    .evento-nombre { font-size: 1.1em; font-weight: 700; color: var(--azul); margin-bottom: 4px; }
    .evento-fecha { font-size: 0.9em; color: var(--tinta-suave); margin-bottom: 18px; }
    button {
      padding: 10px 18px; border: none; background: var(--azul); color: white;
      border-radius: 999px; cursor: pointer; font-family: inherit; font-size: 0.92em;
      font-weight: 600; box-shadow: var(--sombra); display: inline-flex; align-items: center; gap: 6px;
    }
    button.secondary { background: var(--superficie); color: var(--tinta); border: 1px solid var(--linea); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label {
      display: block; font-size: 0.75em; margin-bottom: 5px; font-weight: 700;
      color: var(--tinta-suave); text-transform: uppercase; letter-spacing: 0.04em;
    }
    .form-group input {
      width: 100%; padding: 10px; border: 1px solid var(--linea); border-radius: 8px;
      font-size: 0.95em; font-family: inherit; background: var(--superficie-tenue); text-transform: uppercase;
    }
    .form-group input::placeholder { text-transform: none; }
    .status {
      margin-top: 15px; padding: 14px; font-weight: 700; border-radius: 12px;
      font-size: 0.95em; text-align: center;
    }
    .status.normal { background: var(--superficie-tenue); color: var(--tinta-suave); font-weight: 600; }
    .status.exito { background: var(--verde-bg); color: var(--verde); border: 1px solid rgba(46,125,50,0.25); }
    .status.error { background: var(--rojo-bg); color: var(--rojo); border: 1px solid rgba(211,47,47,0.25); }
    #resultado { display: none; margin-top: 20px; text-align: center; }
    #qrcode { margin-top: 10px; display: flex; justify-content: center; }
    .lista-eventos button { display:block; width:100%; text-align:left; margin-bottom:8px; }
  </style>
</head>

    function sumarDias(fechaTexto, dias) {
      const partes = fechaTexto.split('-').map(Number);
      const d = new Date(partes[0], partes[1] - 1, partes[2]);
      d.setDate(d.getDate() + dias);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function mayus_(texto) { return (texto || '').toString().trim().toUpperCase(); }
    function utf8ParaQR_(texto) { return unescape(encodeURIComponent(texto)); }

    document.addEventListener('input', function (evento) {
      const campo = evento.target;
      if (campo.tagName !== 'INPUT' || campo.type !== 'text') return;
      const inicio = campo.selectionStart, fin = campo.selectionEnd;
      campo.value = campo.value.toUpperCase();
      if (inicio !== null && fin !== null) campo.setSelectionRange(inicio, fin);
    });

    function buscarEventosAbiertos() {
      const hoy = fechaHoy();
      db.collection('eventos').get().then(function (snap) {
        const abiertos = [];
        snap.forEach(function (doc) {
          const e = doc.data();
          const inicioRegistro = sumarDias(e.fecha, -1);
          // Abierto desde el día anterior hasta el día del evento (inclusive).
          if (hoy >= inicioRegistro && hoy <= e.fecha) {
            abiertos.push({ id: doc.id, datos: e });
          }
        });

        document.getElementById('cargando').style.display = 'none';

        if (abiertos.length === 0) {
          document.getElementById('sin-eventos').style.display = 'block';
          return;
        }

        if (abiertos.length === 1) {
          elegirEvento(abiertos[0]);
          return;
        }

        const contenedor = document.getElementById('botones-eventos');
        contenedor.innerHTML = '';
        abiertos.forEach(function (item) {
          const boton = document.createElement('button');
          boton.className = 'secondary';
          boton.innerText = item.datos.nombre + ' — ' + item.datos.fecha;
          boton.onclick = function () { elegirEvento(item); };
          contenedor.appendChild(boton);
        });
        document.getElementById('lista-eventos').style.display = 'block';
      }).catch(function (error) {
        document.getElementById('cargando').innerText = 'Error al buscar eventos: ' + error.message;
        document.getElementById('cargando').className = 'status error';
      });
    }

    function elegirEvento(item) {
      eventoElegido = item;
      document.getElementById('lista-eventos').style.display = 'none';
      document.getElementById('nombre-evento-elegido').innerText = item.datos.nombre;
      document.getElementById('fecha-evento-elegido').innerText = 'Fecha: ' + item.datos.fecha;
      document.getElementById('formulario-registro').style.display = 'block';
    }

    function registrarAcompanante() {
      const nombre = mayus_(document.getElementById('nombre-acompanante').value);
      const mensajeElem = document.getElementById('mensaje');
      const boton = document.getElementById('btnRegistrar');

      mensajeElem.style.display = 'block';

      if (!nombre) {
        mensajeElem.innerText = 'Escribe el nombre del acompañante.';
        mensajeElem.className = 'status error';
        return;
      }
      if (typeof QRCode === 'undefined') {
        mensajeElem.innerText = 'No se pudo cargar la librería de generación de QR.';
        mensajeElem.className = 'status error';
        return;
      }

      boton.disabled = true;
      mensajeElem.innerText = 'Registrando...';
      mensajeElem.className = 'status normal';

      const fecha = eventoElegido.datos.fecha;
      const visita = mayus_(eventoElegido.datos.nombre);

      db.collection('permitidos').add({ nombre: nombre, fecha: fecha, visita: visita, creado: Date.now() })
        .then(function () {
          const contenido = JSON.stringify({ nombre: nombre, fecha: fecha });
          const contenedor = document.getElementById('qrcode');
          contenedor.innerHTML = '';

          new QRCode(contenedor, {
            text: utf8ParaQR_(contenido), width: 220, height: 220,
            colorDark: '#000000', colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
          });

          document.getElementById('resultado').style.display = 'block';
          mensajeElem.innerText = 'Registrado: ' + nombre;
          mensajeElem.className = 'status exito';
          qrActual = { nombre: nombre, fecha: fecha };
          boton.disabled = false;
        })
        .catch(function (error) {
          mensajeElem.innerText = 'Error al registrar: ' + error.message;
          mensajeElem.className = 'status error';
          boton.disabled = false;
        });
    }

    function descargarQR() {
      const contenedor = document.getElementById('qrcode');
      const canvas = contenedor.querySelector('canvas');
      const img = contenedor.querySelector('img');
      const nombreArchivo = qrActual ? 'qr_' + qrActual.nombre.replace(/\s+/g, '_') + '_' + qrActual.fecha + '.png' : 'codigo_qr.png';
      const link = document.createElement('a');
      link.download = nombreArchivo;
      if (canvas) link.href = canvas.toDataURL('image/png');
      else if (img) link.href = img.src;
      else { alert('Genera un código QR primero.'); return; }
      link.click();
    }

    function nuevoRegistro() {
      document.getElementById('nombre-acompanante').value = '';
      document.getElementById('qrcode').innerHTML = '';
      document.getElementById('resultado').style.display = 'none';
      document.getElementById('mensaje').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', buscarEventosAbiertos);
  </script>
</body>
</html>
