<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Control de Acceso</title>

  <!-- Firebase (Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- Escaneo de QR -->
  <script src="https://unpkg.com/html5-qrcode"
          onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';document.head.appendChild(s);">
  </script>
  <!-- Generación de QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
          onerror="var s=document.createElement('script');s.src='https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js';document.head.appendChild(s);">
  </script>
  <!-- Generación de ZIP para lotes de QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Tipografía e íconos (paleta Stitch) -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <style>
    :root {
      --azul: #000c47;
      --azul-container: #001b7a;
      --azul-tenue: rgba(0, 12, 71, 0.06);
      --ambar-bg: #fed488;
      --ambar-texto: #775a19;
      --fondo: #ffffff;
      --superficie: #ffffff;
      --superficie-tenue: #F5F5F7;
      --tinta: #1b1b21;
      --tinta-suave: #454652;
      --contorno: #757683;
      --linea: #E4E4E7;
      --verde: #2e7d32;
      --verde-bg: #e3f5e6;
      --rojo: #d32f2f;
      --rojo-bg: #fce4e4;
      --radio: 12px;
      --sombra: 0 1px 3px rgba(27, 27, 33, 0.07), 0 1px 2px rgba(27, 27, 33, 0.06);
      --sombra-hover: 0 4px 14px rgba(27, 27, 33, 0.12);
    }

    * { box-sizing: border-box; }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      font-size: 1.15em;
      vertical-align: -3px;
      line-height: 1;
    }

    body {
      font-family: 'Hanken Grotesk', -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo);
      color: var(--tinta);
      max-width: 520px;
      margin: 0 auto;
      padding: 0 12px 84px;
      min-height: 100vh;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 4px 14px;
      margin-bottom: 6px;
    }
    .marca .icono {
      width: 44px; height: 44px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .marca .icono img {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .marca .icono .material-symbols-outlined { font-size: 22px; vertical-align: 0; }
    .marca .texto { text-align: left; line-height: 1.15; }
    .marca .texto strong { display: block; font-size: 1.05em; font-weight: 700; letter-spacing: 0.1px; }
    .marca .texto span { font-size: 0.75em; color: var(--tinta-suave); }

    nav {
      display: flex; gap: 8px; justify-content: center;
      margin-bottom: 18px; flex-wrap: wrap;
    }

    button {
      padding: 10px 18px;
      border: none;
      background: var(--azul);
      color: white;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.92em;
      font-weight: 600;
      letter-spacing: 0.1px;
      box-shadow: var(--sombra);
      display: inline-flex; align-items: center; gap: 6px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, opacity 0.12s ease;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--sombra-hover); }
    button:active:not(:disabled) { transform: translateY(0); }
    button.secondary { background: var(--superficie); color: var(--tinta); border: 1px solid var(--linea); }
    button.danger { background: var(--rojo); }
    button.small { padding: 5px 12px; font-size: 0.78em; box-shadow: none; }
    button.small .material-symbols-outlined { font-size: 1em; vertical-align: -2px; }
    button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .card {
      background: var(--superficie);
      padding: 22px 20px;
      border-radius: var(--radio);
      border: 1px solid var(--linea);
      box-shadow: var(--sombra);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--azul), var(--ambar-bg));
    }

    h2 {
      font-size: 1.35em;
      font-weight: 700;
      letter-spacing: 0.1px;
      margin: 4px 0 18px;
      color: var(--azul);
      display: flex; align-items: center; gap: 8px;
    }
    h3 { font-size: 1.05em; font-weight: 600; color: var(--tinta); margin-top: 26px; }

    #reader { width: 100%; margin-top: 10px; border-radius: 10px; overflow: hidden; }

    .status {
      margin-top: 15px; padding: 16px 14px;
      font-weight: 700; border-radius: 12px;
      font-size: 0.98em; text-align: center;
      letter-spacing: 0.1px;
      animation: aparecer 0.18s ease;
    }
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .status.normal { background: var(--superficie-tenue); color: var(--tinta-suave); font-weight: 600; }
    .status.exito { background: var(--verde-bg); color: var(--verde); border: 1px solid rgba(46,125,50,0.25); }
    .status.error { background: var(--rojo-bg); color: var(--rojo); border: 1px solid rgba(211,47,47,0.25); }

    .status.overlay-centrado {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      min-width: 260px;
      max-width: 90vw;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    table {
      width: 100%; border-collapse: separate; border-spacing: 0;
      margin-top: 15px; border-radius: 10px; overflow: hidden;
      border: 1px solid var(--linea);
    }
    th, td { padding: 10px 10px; text-align: left; font-size: 0.85em; }
    td { text-transform: uppercase; }
    td button { text-transform: none; }
    th {
      background: var(--azul-tenue); color: var(--tinta-suave);
      font-weight: 700; letter-spacing: 0.04em;
      font-size: 0.72em; text-transform: uppercase;
    }
    tbody tr { border-top: 1px solid var(--linea); }
    tbody tr:nth-child(even) { background: var(--superficie-tenue); }
    tbody tr:hover { background: var(--azul-tenue); }

    .badge {
      padding: 4px 11px; border-radius: 999px;
      font-size: 0.76em; font-weight: 700; letter-spacing: 0.2px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .badge .material-symbols-outlined { font-size: 1em; vertical-align: -2px; }
    .badge.ok { background: var(--verde-bg); color: var(--verde); }
    .badge.no { background: var(--rojo-bg); color: var(--rojo); }
    .badge.pendiente { background: var(--ambar-bg); color: var(--ambar-texto); }
    .badge.activo { background: var(--verde-bg); color: var(--verde); }
    .badge.inactivo { background: var(--superficie-tenue); color: var(--tinta-suave); }

    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label {
      display: block; font-size: 0.75em; margin-bottom: 5px;
      font-weight: 700; color: var(--tinta-suave);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 10px; box-sizing: border-box;
      border: 1px solid var(--linea); border-radius: 8px;
      font-size: 0.95em; font-family: inherit;
      background: var(--superficie-tenue);
      transition: border-color 0.12s ease, background 0.12s ease;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: none; border-color: var(--azul); background: var(--superficie);
    }

    #gen-resultado, #genp-resultado { display: none; margin-top: 15px; }
    #gen-qrcode, #genp-qrcode { margin-top: 10px; display: flex; justify-content: center; }

    hr { border: none; border-top: 1px solid var(--linea); }
    .mayusculas-auto { text-transform: uppercase; }
    input[readonly] { background: var(--superficie-tenue); color: var(--tinta-suave); }
    code {
      background: var(--superficie-tenue); padding: 2px 6px; border-radius: 5px;
      font-size: 0.85em; color: var(--azul-container);
    }

    #nav-principal {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-width: 520px;
      margin: 0 auto;
      background: var(--superficie);
      border-top: 1px solid var(--linea);
      box-shadow: 0 -4px 14px rgba(27, 27, 33, 0.08);
      display: flex; justify-content: space-around; align-items: stretch;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
      margin-bottom: 0;
      z-index: 100;
      gap: 0;
    }
    #nav-principal button {
      background: none; box-shadow: none; color: var(--tinta-suave);
      flex-direction: column; gap: 2px;
      padding: 6px 4px; border-radius: 12px;
      flex: 1; min-width: 0;
    }
    #nav-principal button:hover { transform: none; box-shadow: none; background: var(--superficie-tenue); }
    #nav-principal button .material-symbols-outlined { font-size: 22px; vertical-align: 0; }
    #nav-principal button small { font-size: 0.68em; font-weight: 600; letter-spacing: 0.1px; }
    #nav-principal button.activo { color: var(--azul); background: var(--azul-tenue); }
  </style>
</head>
<body>

  <!-- Pantalla de inicio de sesión -->
  <div id="pantalla-login" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; text-align:center;">
    <div style="width:72px; height:72px; margin-bottom:16px;">
      <span class="material-symbols-outlined" style="font-size:72px; color:var(--azul);">shield_person</span>
    </div>
    <h2 style="margin-bottom:4px; justify-content:center;">Control de Acceso</h2>
    <p style="color:var(--tinta-suave); margin-bottom:24px;">Colegio Francés Pasteur</p>
    <button onclick="iniciarSesionGoogle()" class="secondary">
      <span class="material-symbols-outlined">login</span> Iniciar sesión con Google
    </button>
    <div id="login-mensaje" class="status normal" style="display:none; margin-top:20px; max-width:320px;"></div>
  </div>

  <!-- Contenido de la app (oculto hasta iniciar sesión) -->
  <div id="app-contenido" style="display:none;">

    <div class="marca">
      <div class="icono">
        <span class="material-symbols-outlined" style="color:var(--azul);">verified_user</span>
      </div>
      <div class="texto">
        <strong>Control de Acceso</strong>
        <span>Colegio Francés Pasteur</span>
      </div>
    </div>

    <!-- Navegación móvil inferior -->
    <nav id="nav-principal">
      <button class="activo">
        <span class="material-symbols-outlined">qr_code_scanner</span>
        <small>Escanear</small>
      </button>
      <button>
        <span class="material-symbols-outlined">badge</span>
        <small>Pases</small>
      </button>
      <button>
        <span class="material-symbols-outlined">history</span>
        <small>Registros</small>
      </button>
    </nav>

    <!-- Contenedor principal de vistas -->
    <div class="card">
      <h2><span class="material-symbols-outlined">qr_code_scanner</span> Escáner QR</h2>
      <div id="reader"></div>
      <div id="status-escaner" class="status normal">Esperando código QR...</div>
    </div>

  </div>

  <script>
    function iniciarSesionGoogle() {
      console.log("Iniciando autenticación...");
    }
  </script>

</body>
</html>
